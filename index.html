<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>暗黑桌面掛機：深淵刷寶 ARPG</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="app-shell">
    <!-- 頂部全域資源列 -->
    <header id="top-hud">
      <div class="hud-left">
        <span class="brand-title">⚔️ 暗黑桌面掛機</span>
        <span id="hud-class-badge" class="badge">狂戰士 Lv.1</span>
        <span id="hud-dps" class="badge dps">DPS 0</span>
        <button id="btn-switch-class" class="btn-ghost">切換職業</button>
      </div>
      <div class="hud-exp-wrap">
        <div id="hud-exp-bar"></div>
        <span id="hud-exp-text">EXP 0 / 45</span>
      </div>
      <div class="hud-right">
        <div class="res-pill">💰 <span id="hud-gold">0</span></div>
        <div class="res-pill">💎 <span id="hud-dust">0</span></div>
      </div>
    </header>

    <!-- 電腦版雙欄主體 -->
    <main id="desktop-main">
      <!-- 左側：Phaser 戰鬥舞台 -->
      <section id="stage-column">
        <div id="stage-banner">
          <button id="btn-stage-prev" class="btn-stage">◀</button>
          <div class="stage-info">
            <span id="hud-stage-title">第 1 關・腐朽邊境營地</span>
            <span id="hud-wave-badge" class="wave-pill">波次 1 / 5</span>
          </div>
          <button id="btn-stage-next" class="btn-stage">▶</button>
        </div>

        <div id="phaser-stage"></div>

        <div id="skill-bar">
          <div class="skill-slot">
            <span>⚡ 主動技能：<strong id="skill-name-label">旋風重斬</strong></span>
            <div class="skill-cd-track"><div id="skill-cd-fill"></div></div>
          </div>
          <div class="tap-hint">💡 提示：點擊右側怪物可進行額外輔助點擊攻擊</div>
        </div>
      </section>

      <!-- 右側：暗黑風 RPG 管理面板 -->
      <aside id="rpg-column">
        <nav id="rpg-tabs">
          <button class="tab-btn active" data-tab="gear">🛡️ 角色與裝備</button>
          <button class="tab-btn" data-tab="bag">🎒 背包 (<span id="inv-count">0 / 60</span>)</button>
          <button class="tab-btn" data-tab="upgrade">🔥 屬性強化</button>
          <button class="tab-btn" data-tab="log">📜 戰鬥日誌</button>
        </nav>

        <div id="tab-gear" class="tab-panel active">
          <div id="equip-slots-grid"></div>
          <div class="section-subtitle">角色即時戰鬥屬性</div>
          <div id="char-stats-list"></div>
        </div>

        <div id="tab-bag" class="tab-panel">
          <div class="bag-toolbar">
            <div class="auto-salvage-group">
              <span>自動分解：</span>
              <label><input type="checkbox" id="auto-salvage-common" /> 普通</label>
              <label><input type="checkbox" id="auto-salvage-magic" /> 魔法</label>
              <label><input type="checkbox" id="auto-salvage-rare" /> 稀有</label>
            </div>
            <button id="btn-salvage-junk" class="btn-danger-sm">一鍵分解白/藍裝</button>
          </div>
          <div id="inventory-grid"></div>
        </div>

        <div id="tab-upgrade" class="tab-panel">
          <div class="section-subtitle">金幣永久訓練</div>
          <div id="gold-upgrades-list"></div>
        </div>

        <div id="tab-log" class="tab-panel">
          <div id="log-content"></div>
        </div>

        <!-- 底部共用裝備詞條檢視器 -->
        <div id="item-inspector">
          <div class="empty-tip">點擊裝備或背包物品查看詳細詞條</div>
        </div>
      </aside>
    </main>
  </div>

  <!-- 職業選擇彈窗 -->
  <div id="modal-class" class="modal-overlay hidden">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h2>選擇你的暗黑冒險職業</h2>
        <button id="btn-close-class-modal" class="btn-ghost">關閉</button>
      </div>
      <div id="class-select-grid"></div>
    </div>
  </div>

  <!-- 離線掛機結算彈窗 -->
  <div id="modal-offline" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>🌙 歡迎回來！離線掛機收益</h2>
      <div id="offline-summary"></div>
      <button id="btn-claim-offline" class="btn-primary">領取所有戰利品</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
